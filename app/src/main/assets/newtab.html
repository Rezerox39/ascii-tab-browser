<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<style>
:root{
  --accent:#9fd8ff; --accent-rgb:159,216,255;
  --text:#f2f2f2; --dim:#8a8a8a; --faint:#4a4a4a; --line:rgba(255,255,255,.09);
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--text);font:13px/1.35 var(--sans);-webkit-font-smoothing:antialiased}
::selection{background:rgba(var(--accent-rgb),.35)}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;font-family:var(--mono);transition:opacity .45s var(--ease)}
canvas.swap{opacity:0}
#svgdefs{position:absolute;width:0;height:0}

/* jet-black glass: smoked, frosted, with a bent rim (SVG filter) and an accent hairline */
.glass{position:relative;background:rgba(0,0,0,.62);border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 0 1px rgba(0,0,0,.9),0 24px 60px rgba(0,0,0,.7);
  -webkit-backdrop-filter:blur(10px) saturate(140%);backdrop-filter:blur(10px) saturate(140%)}
/* ascii corner ticks */
.ticks::before,.ticks::after{position:absolute;font:11px/1 var(--mono);color:rgba(var(--accent-rgb),.55);pointer-events:none;transition:color .3s}
.ticks::before{content:"┌";top:-6px;left:-5px}
.ticks::after{content:"┘";bottom:-6px;right:-5px}

/* ── hero ── */
#hero{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);width:min(680px,calc(100vw - 32px));z-index:2;transition:opacity .4s var(--ease),transform .5s var(--ease)}
#hero.hide-search #search{display:none}
#clock{font:500 12px var(--mono);letter-spacing:.18em;color:var(--dim);text-transform:uppercase;margin:0 0 10px 4px}
#clock b{color:rgba(var(--accent-rgb),.9);font-weight:500}
#greet{font:600 clamp(28px,4.2vw,46px)/1.1 var(--sans);letter-spacing:-.02em;margin:0 0 22px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#greet .name{color:rgba(var(--accent-rgb),1);cursor:text;outline:none;border-radius:6px;transition:background .2s}
#greet .name:hover,#greet .name:focus{background:rgba(var(--accent-rgb),.1)}
#greet .cur{display:inline-block;width:.5em;height:.9em;margin-left:.08em;vertical-align:-.06em;background:rgba(var(--accent-rgb),.9);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

#search{display:flex;align-items:center;gap:12px;height:60px;padding:0 10px 0 18px;border-radius:14px;transition:border-color .25s,box-shadow .25s}
#search:focus-within{border-color:rgba(var(--accent-rgb),.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 4px rgba(var(--accent-rgb),.08),0 24px 60px rgba(0,0,0,.7)}
#prompt{font:600 16px var(--mono);color:rgba(var(--accent-rgb),1);flex:none;width:12px}
#q{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:16px var(--sans)}
#q::placeholder{color:#6a6a6a}
#modes{display:flex;flex:none;padding:3px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid var(--line);position:relative}
#modes button{all:unset;cursor:pointer;position:relative;z-index:1;font:500 11px var(--mono);letter-spacing:.06em;color:var(--dim);padding:6px 10px;border-radius:6px;transition:color .25s}
#modes button.on{color:#000}
#pill{position:absolute;top:3px;bottom:3px;border-radius:6px;background:rgba(var(--accent-rgb),1);transition:left .35s var(--ease),width .35s var(--ease),background .3s}
#keys{margin:12px 4px 0;font:11px var(--mono);color:var(--faint);display:flex;gap:16px}
#keys kbd{font:inherit;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-right:4px}

/* ── bottom bar ── */
#status{position:fixed;left:18px;bottom:16px;font:11px var(--mono);color:var(--faint);letter-spacing:.04em;z-index:2;transition:opacity .3s}
#status span{color:var(--dim)}
#open{all:unset;cursor:pointer;position:fixed;right:18px;bottom:14px;z-index:3;font:500 12px var(--mono);letter-spacing:.06em;color:var(--dim);padding:9px 14px;border-radius:10px;transition:color .2s,transform .3s var(--ease)}
#open:hover{color:var(--text);transform:translateY(-1px)}
#open i{font-style:normal;color:rgba(var(--accent-rgb),1)}

/* ── drawer ── */
#scrim{position:fixed;inset:0;z-index:3;background:rgba(0,0,0,0);pointer-events:none;transition:background .4s var(--ease)}
body.open #scrim{background:rgba(0,0,0,.25);pointer-events:auto}
#drawer{position:fixed;top:12px;right:12px;bottom:12px;width:340px;max-width:calc(100vw - 24px);z-index:4;border-radius:18px;display:flex;flex-direction:column;
  transform:translateX(calc(100% + 30px)) scale(.98);opacity:0;transition:transform .55s var(--ease),opacity .35s var(--ease)}
body.open #drawer{transform:none;opacity:1}
#dhead{display:flex;align-items:center;padding:16px 16px 12px 20px;font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#dhead strong{flex:1;color:var(--text)}
.mini{all:unset;cursor:pointer;font:500 11px var(--mono);color:var(--dim);padding:5px 9px;border-radius:7px;border:1px solid var(--line);margin-left:6px;transition:color .2s,border-color .2s}
.mini:hover{color:var(--text);border-color:rgba(255,255,255,.2)}
#dbody{overflow-y:auto;overflow-x:hidden;padding:0 20px 24px;scrollbar-width:thin;scrollbar-color:#333 transparent}
.sec{font:500 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;border-top:1px dashed #262626}

#animals{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ani{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.02);font:500 12px var(--sans);color:#cfcfcf;transition:border-color .25s,background .25s,transform .25s var(--ease)}
.ani:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.18)}
.ani i{font:600 10px var(--mono);letter-spacing:.05em;color:var(--sw)}
.ani.on{border-color:var(--sw);background:color-mix(in srgb,var(--sw) 12%,transparent);color:#fff}

#themes{display:flex;gap:8px}
#colours{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.col{all:unset;cursor:pointer;width:24px;height:24px;border-radius:6px;background:var(--c);box-shadow:inset 0 0 0 2px #000;outline:1px solid transparent;outline-offset:2px;transition:outline-color .2s,transform .25s var(--ease)}
.col:hover{transform:scale(1.1)}
.col.on{outline-color:#fff}
#colours .mini{margin-left:auto}
.th{all:unset;cursor:pointer;width:26px;height:26px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 2px #000;outline:1px solid transparent;outline-offset:2px;transition:outline-color .2s,transform .25s var(--ease)}
.th:hover{transform:scale(1.08)}
.th.on{outline-color:var(--c)}

.field{display:flex;align-items:center;gap:10px;margin:6px 0}
.field label{flex:1;color:#cfcfcf}
.txt{width:150px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;color:#fff;font:13px var(--sans);padding:7px 10px;outline:0;transition:border-color .2s}
.txt:focus{border-color:rgba(var(--accent-rgb),.5)}

.knob{display:grid;grid-template-columns:1fr auto;align-items:center;row-gap:6px;margin:12px 0}
.knob span{color:#cfcfcf}
.knob b{font:500 11px var(--mono);color:var(--dim)}
.knob input[type=range]{grid-column:1/-1;width:100%;margin:0;-webkit-appearance:none;appearance:none;height:2px;background:linear-gradient(90deg,rgba(var(--accent-rgb),.9) var(--p,50%),#2a2a2a var(--p,50%));outline:0;cursor:pointer}
.knob input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:2px;background:#fff;border:0;box-shadow:0 0 0 3px #000;transition:transform .15s}
.knob input[type=range]:active::-webkit-slider-thumb{transform:scale(1.35)}
.knob.off{opacity:.3;pointer-events:none}
.sw{-webkit-appearance:none;appearance:none;width:32px;height:18px;border-radius:999px;background:#262626;position:relative;cursor:pointer;margin:0;transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .3s var(--ease)}
.sw:checked{background:rgba(var(--accent-rgb),.9)}
.sw:checked::after{transform:translateX(14px)}
.swrow{display:flex;align-items:center;margin:12px 0}
.swrow span{flex:1;color:#cfcfcf}
details{margin-top:6px}
summary{list-style:none;cursor:pointer;font:500 11px var(--mono);letter-spacing:.08em;color:var(--dim);padding:10px 0;user-select:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"+ ";color:rgba(var(--accent-rgb),1)}
details[open] summary::before{content:"− "}
.hint{font-size:11px;color:var(--faint);margin:-2px 0 0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<svg id="svgdefs" aria-hidden="true"></svg>

<main id="hero">
  <div id="clock"></div>
  <h1 id="greet"></h1>
  <form id="search" class="glass ticks" role="search" autocomplete="off">
    <span id="prompt">›</span>
    <input id="q" placeholder="Search Google" autofocus spellcheck="false">
    <div id="modes"><div id="pill"></div><button type="button" data-mode="google">google</button><button type="button" data-mode="ask">ask ai</button></div>
  </form>
  <div id="keys"><span><kbd>tab</kbd>switch mode</span><span><kbd>/</kbd>focus</span><span><kbd>.</kbd>tweaks</span><span><kbd>← →</kbd>animal</span><span><kbd>click</kbd>feed / startle</span></div>
</main>

<div id="status"></div>
<button id="open" class="glass ticks"><i>◆</i> tweaks</button>

<div id="scrim"></div>
<aside id="drawer" class="glass" aria-label="Tweaks">
  <div id="dhead"><strong>tweaks</strong><button id="reset" class="mini">reset</button><button id="close" class="mini" aria-label="Close">esc</button></div>
  <div id="dbody"></div>
</aside>

<script src="zoo.js"></script>
</body>
</html>
